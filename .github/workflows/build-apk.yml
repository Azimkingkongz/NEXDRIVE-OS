name: Build & Release NEXDRIVE OS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build NEXDRIVE OS APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk NEXDRIVE-OS-v2.0.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEXDRIVE-OS-APK
          path: NEXDRIVE-OS-v2.0.apk

      - name: Publish APK to GitHub Releases (1-Click Public Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0
          name: "NEXDRIVE OS v2.0 — Android Auto & Car Player APK"
          body: |
            ### 🚗 NEXDRIVE OS v2.0 (Right-Hand Drive Android Auto & Car Player Cockpit)
            Download **`NEXDRIVE-OS-v2.0.apk`** below and install it on your **Android Smartphone** (for Android Auto / CarLink) or directly on your **Android Car Player Head Unit**.
          files: NEXDRIVE-OS-v2.0.apk
          prerelease: false
